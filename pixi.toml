[workspace]
name = "f8media-gateway"
channels = ["conda-forge"]
platforms = ["linux-64", "win-64"]

[dependencies]
python = ">=3.14,<3.15"
pip = ">=26,<27"

[pypi-dependencies]
f8media-gateway = {path = ".", editable = true}
f8media-protocol = {path = "f8media_protocol", editable = true}
f8pysdk = {path = ".sdk/python", editable = true}

[tasks]
serve = "python -m f8media_gateway"

[environments]
media = []
